:root{
  color-scheme: light;
  --olcek: 1;
  --zemin:#f1ece2; --panel:#ffffff; --metin:#1b2a3a; --ikincil:#46576a; --cizgi:#d6cfc1;
  --lacivert:#1d3557; --lacivert2:#2b4a73; --birincil:#1d6f5f; --birincil-k:#155447;
  --vurgu:#d9692a; --basari:#2e7d4f; --hata:#b3261e; --deniz:#3d7ea6; --rihtim:#ddd5c5;
  --k-hareket:#2a7f9e; --t-hareket:#e3f1f6;
  --k-eylem:#c1621f;   --t-eylem:#fbebdd;
  --k-dongu:#6b4fa0;   --t-dongu:#eee8f7;
  --k-karar:#2f5fb3;   --t-karar:#e5ecf9;
  --k-deg:#2e7d4f;     --t-deg:#e3f3e8;
  --golge:0 0.15rem 0.6rem rgba(29,53,87,.12);
  --r:0.8rem;
}
html{font-size:calc(clamp(15px, 0.55vw + 0.75vh + 4px, 22px) * var(--olcek));}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;max-width:100%;overflow:hidden;}
body{font-family:'Roboto',Arial,Helvetica,sans-serif;font-weight:300;color:var(--metin);background:var(--zemin);
  line-height:1.35;-webkit-text-size-adjust:100%;overflow-x:hidden;}
button{font-family:inherit;font-weight:400;font-size:1rem;color:inherit;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;cursor:pointer;}
button:disabled{cursor:not-allowed;opacity:.5;}
:focus-visible{outline:0.22rem solid var(--vurgu);outline-offset:0.12rem;}
h1[tabindex="-1"]:focus,h2[tabindex="-1"]:focus,#ekran:focus{outline:none;}
h1,h2,h3{font-weight:700;margin:0;line-height:1.2;}
p{margin:0;}
svg{display:block;}
.gizli{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
[hidden]{display:none!important;}

/* ---------- Ana çerçeve ---------- */
#uygulama{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100vh;height:100dvh;width:100%;max-width:100%;overflow:hidden;}
.ust{display:flex;align-items:center;gap:0.6rem;padding:0.45rem clamp(0.4rem,1.2vw,1rem);background:var(--lacivert);color:#fff;min-width:0;}
.arac-cubugu{display:flex;gap:0.35rem;flex:0 0 auto;}
.ust-dugme{min-width:44px;min-height:44px;width:2.6rem;height:2.6rem;border-radius:0.6rem;border:0.12rem solid rgba(255,255,255,.55);
  background:var(--lacivert2);color:#fff;display:inline-flex;align-items:center;justify-content:center;padding:0;font-weight:700;font-size:1.05rem;}
.ust-dugme svg{width:1.35rem;height:1.35rem;}
.ust-dugme[aria-pressed="true"]{background:#fff;color:var(--lacivert);}
.ust-baslik{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;}
.ust-baslik strong{font-size:1.2rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ust-baslik span{font-size:0.9rem;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bolumler-dugme{min-height:44px;padding:0.3rem 0.9rem;border-radius:0.6rem;border:0.12rem solid rgba(255,255,255,.55);background:var(--lacivert2);color:#fff;
  display:inline-flex;align-items:center;gap:0.4rem;flex:0 0 auto;}
.bolumler-dugme svg{width:1.3rem;height:1.3rem;}

main#ekran{min-height:0;min-width:0;overflow:hidden;padding:clamp(0.35rem,1vw,0.8rem);}
.alt{display:flex;align-items:center;gap:0.6rem;padding:0.45rem clamp(0.4rem,1.2vw,1rem);background:#fff;border-top:0.1rem solid var(--cizgi);min-width:0;}
.gezinti{min-width:44px;min-height:44px;padding:0.45rem 1.1rem;border-radius:0.7rem;font-size:1.15rem;font-weight:700;
  display:inline-flex;align-items:center;gap:0.45rem;flex:0 0 auto;border:0.14rem solid var(--lacivert);}
.gezinti svg{width:1.4rem;height:1.4rem;}
#geriDugme{background:#fff;color:var(--lacivert);}
#ileriDugme{background:var(--lacivert);color:#fff;margin-left:auto;}
#ileriDugme.dikkat{background:var(--basari);border-color:var(--basari);animation:nabiz 1.4s ease-in-out infinite;}
@keyframes nabiz{0%,100%{box-shadow:0 0 0 0 rgba(46,125,79,.5);}50%{box-shadow:0 0 0 0.45rem rgba(46,125,79,0);}}
#durum{flex:1 1 auto;min-width:0;text-align:center;font-size:1.05rem;font-weight:400;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
#durum.iyi{color:var(--basari);} #durum.kotu{color:var(--hata);}

/* ---------- Genel paneller ---------- */
.panel{background:var(--panel);border-radius:var(--r);box-shadow:var(--golge);display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;}
.panel-baslik{display:flex;align-items:center;justify-content:space-between;gap:0.4rem;padding:0.55rem 0.8rem;border-bottom:0.1rem solid var(--cizgi);flex:0 0 auto;}
.panel-baslik h2{font-size:1.1rem;}
.panel-baslik small{font-size:0.9rem;color:var(--ikincil);font-weight:400;}
.kaydir{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;min-height:0;}
.dugme{min-height:44px;min-width:44px;padding:0.45rem 0.9rem;border-radius:0.65rem;border:0.13rem solid var(--lacivert);background:#fff;color:var(--lacivert);
  display:inline-flex;align-items:center;justify-content:center;gap:0.4rem;font-size:1.02rem;}
.dugme svg{width:1.25rem;height:1.25rem;flex:0 0 auto;}
.dugme.birincil{background:var(--birincil);border-color:var(--birincil);color:#fff;}
.dugme.birincil.durdur{background:var(--hata);border-color:var(--hata);}

/* ---------- Giriş ---------- */
.giris{height:100%;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(0.6rem,2vw,1.6rem);align-items:center;max-width:76rem;margin:0 auto;}
.giris-metin{display:flex;flex-direction:column;gap:0.8rem;min-width:0;}
.giris-metin h1{font-size:clamp(1.8rem,3.4vw,3rem);color:var(--lacivert);}
.giris-metin p{font-size:1.2rem;}
.giris-gorsel{min-width:0;max-height:100%;display:flex;align-items:center;justify-content:center;}
.giris-gorsel svg{width:100%;height:auto;max-height:60vh;}
.lejant{display:flex;flex-wrap:wrap;gap:0.5rem 1rem;margin-top:0.3rem;}
.lejant span{display:inline-flex;align-items:center;gap:0.4rem;font-size:1rem;}
.lejant i{width:1.8rem;height:1.8rem;border-radius:0.3rem;display:inline-block;flex:0 0 auto;border:0.08rem solid #9d927f;}

/* ---------- Bölüm haritası ---------- */
.harita{height:100%;display:flex;flex-direction:column;gap:0.6rem;min-height:0;}
.harita h1{font-size:1.5rem;color:var(--lacivert);}
.bolum-izgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,15rem),1fr));gap:0.6rem;min-height:0;padding:0.15rem;}
.bolum-kart{text-align:left;min-height:44px;border-radius:var(--r);border:0.14rem solid var(--cizgi);background:#fff;padding:0.7rem 0.9rem;
  display:flex;flex-direction:column;gap:0.25rem;box-shadow:var(--golge);border-left:0.55rem solid var(--renk,#2a7f9e);}
.bolum-kart .no{font-size:0.95rem;color:var(--ikincil);}
.bolum-kart strong{font-size:1.25rem;font-weight:700;}
.bolum-kart .kavram{font-size:1rem;font-weight:300;}
.ilerleme{display:flex;gap:0.3rem;align-items:center;margin-top:0.2rem;font-size:0.95rem;}
.ilerleme i{width:0.9rem;height:0.9rem;border-radius:50%;border:0.12rem solid var(--basari);display:inline-block;}
.ilerleme i.tamam{background:var(--basari);}

/* ---------- Görev ekranı ---------- */
.gorev{display:grid;height:100%;gap:clamp(0.35rem,0.9vw,0.75rem);min-height:0;
  grid-template-columns:minmax(0,1fr) minmax(0,1.8fr) minmax(0,1.15fr);grid-template-areas:"sol orta sag";grid-template-rows:minmax(0,1fr);}
.alan-sol{grid-area:sol;display:flex;flex-direction:column;gap:clamp(0.35rem,0.9vw,0.75rem);min-height:0;min-width:0;}
.alan-orta{grid-area:orta;} .alan-sag{grid-area:sag;}
.yonerge{flex:0 1 auto;max-height:55%;}
.yonerge .icerik{padding:0.7rem 0.85rem;display:flex;flex-direction:column;gap:0.5rem;}
.cip{align-self:flex-start;font-size:0.9rem;font-weight:700;padding:0.15rem 0.6rem;border-radius:1rem;background:var(--lacivert);color:#fff;}
.yonerge h1{font-size:1.3rem;color:var(--lacivert);}
.yonerge .metin{font-size:1.12rem;}
.kavram-not{font-size:0.98rem;color:var(--ikincil);border-left:0.25rem solid var(--vurgu);padding-left:0.5rem;}
.ipucu-liste{margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:0.35rem;font-size:1.05rem;}
.palet{flex:1 1 auto;}
.palet .icerik{padding:0.6rem;display:flex;flex-direction:column;gap:0.45rem;}
.palet-not{font-size:0.95rem;color:var(--ikincil);}
.komut{width:100%;min-height:44px;text-align:left;border-radius:0.6rem;border:0.12rem solid var(--k);border-left-width:0.55rem;background:var(--t);
  padding:0.45rem 0.6rem;display:flex;align-items:center;gap:0.5rem;font-size:1.05rem;}
.komut svg{width:1.4rem;height:1.4rem;flex:0 0 auto;color:var(--k);}

  var sonId = 0;
  function yeniId() { sonId += 1; return 'n' + sonId; }
  function dugumKur(anahtar) {
    var k = KOMUT[anahtar];
    var n = { id: yeniId(), t: k.t || anahtar };
    if (k.k) n.k = k.k;
    if (anahtar === 'tekrar') n.n = 3;
    if (k.kap) n.ic = [];
    return n;
  }
  function programKur(spec) {
    return spec.map(function (s) {
      if (typeof s === 'string') return dugumKur(s);
      var n = dugumKur(s[0]);
      if (s[0] === 'tekrar') { n.n = s[1]; n.ic = programKur(s[2]); }
      else { n.ic = programKur(s[1]); }
      return n;
    });
  }
  function kopyala(liste) {
    return liste.map(function (n) {
      var c = { id: yeniId(), t: n.t };
      if (n.k) c.k = n.k;
      if (n.n !== undefined) c.n = n.n;
      if (n.ic) c.ic = kopyala(n.ic);
      return c;
    });
  }
  function blokSayisi(liste) {
    var s = 0;
    liste.forEach(function (n) { s += 1; if (n.ic) s += blokSayisi(n.ic); });
    return s;
  }

  function bul(liste, id, ebeveyn) {

  var DX = [1, 0, -1, 0], DY = [0, 1, 0, -1];

  function yorumla(prog, dn) {
    var d = ilkDurum(dn), adimlar = [], hata = null;
    function kaydet(blok, olay, ek) {
      adimlar.push({ blok: blok, olay: olay, ek: ek || null, d: durumKopya(d) });
      if (adimlar.length > ADIM_SINIRI) throw { kod: 'sonsuz', blok: blok };
    }
    function anahtar() { return d.x + ',' + d.y; }
    function kosul(k) {
      var s = d.kon[anahtar()];
      if (k === 'kirmizi') return !!(s && s.length && s[s.length - 1] === 'k');
      if (k === 'konteyner') return !!(s && s.length);

      return false;
    }
    function calis(liste) {
      for (var i = 0; i < liste.length; i++) {
        var n = liste[i];
        if (n.t === 'ileri') {
          var nx = d.x + DX[d.yon], ny = d.y + DY[d.yon];
          if (nx < 0 || ny < 0 || nx >= dn.W || ny >= dn.H) throw { kod: 'disari', blok: n.id };
          if (dn.hucre[ny][nx] === 'su') throw { kod: 'su', blok: n.id };
          d.x = nx; d.y = ny; kaydet(n.id, 'hareket');
        } else if (n.t === 'sag') {
          d.yon = (d.yon + 1) % 4; d.aci += 90; kaydet(n.id, 'don');
        } else if (n.t === 'sol') {
          d.yon = (d.yon + 3) % 4; d.aci -= 90; kaydet(n.id, 'don');
        } else if (n.t === 'al') {

          var a = anahtar(); if (!d.kon[a]) d.kon[a] = [];

        } else if (n.t === 'artir') {
          if (d.deg.sayac === undefined) throw { kod: 'tanimsiz', blok: n.id };

        } else if (n.t === 'tekrar') {
          for (var t = 0; t < n.n; t++) { kaydet(n.id, 'tur', { i: t + 1, n: n.n }); calis(n.ic); }
        } else if (n.t === 'eger') {

  }

  function say(dn, renk) {

      var top = say(dn), depoda = 0;
